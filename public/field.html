<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trabalho no terreno · Atlas</title><link rel="stylesheet" href="/product.css"><script src="/client-context.js"></script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#126557"></head><body><header class="product-header"><a class="brand" href="/home.html">◈ atlas</a><nav data-product-nav aria-label="Navegação principal"></nav></header><main><div class="hero"><div class="eyebrow">O seu espaço de trabalho</div><h1>Trabalho no terreno</h1><p>Consulte a ficha, registe uma fotografia e documente o trabalho realizado.</p></div><p id="productStatus" role="status"></p><section id="fieldRecord" class="panel"></section><div class="actions"><a id="fieldRequest" class="button secondary">Comunicar um problema</a><a id="fieldEditor" class="button secondary" data-editor-only>Abrir no editor</a></div><form id="fieldForm" class="panel mobile-actions" data-editor-only hidden><h2>Registar trabalho</h2><label>Estado<select name="state"><option value="">Por definir</option><option>Em serviço</option><option>Em reserva</option><option>Em manutenção</option><option>Abatido</option></select></label><label>Trabalho realizado<input name="title" maxlength="160" required placeholder="Ex.: Substituição do cabo da tomada"></label><label>Data<input name="date" type="date" required></label><label>Resultado e observações<textarea name="notes" maxlength="3000"></textarea></label><label>Próxima revisão (opcional)<input name="nextMaintenance" type="date"></label><label>Fotografia<input id="fieldPhoto" type="file" accept="image/png,image/jpeg,image/webp" capture="environment"></label><p id="fieldDraftNotice"></p><button id="saveField">Guardar intervenção</button></form><section class="panel"><h2>Intervenções registadas</h2><div id="fieldHistory"></div></section></main><script type="module" src="/field-page.js"></script></body></html>
