<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inventário · Atlas</title><link rel="stylesheet" href="/layout.css"><style>body{overflow:auto}main{max-width:1400px;margin:auto;padding:24px}nav,.filters{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #8893a644}.scroll{overflow:auto}#plant svg{width:100%;height:auto;background:#fff}#plant{margin-top:24px}input,select{max-width:100%}</style></head><body><main><nav><a href="/">Editor completo</a><a href="/account">Conta</a></nav><h1>Inventário e plantas por piso</h1><p>Pesquise por nome, IP ou série. O inventário é consultado por páginas; abrir uma planta carrega apenas os equipamentos desse piso.</p><div class="filters"><label>Pesquisar<input id="query" type="search" maxlength="160"></label><label>Piso<select id="floor"><option value="">Todos os pisos</option></select></label><button id="search">Pesquisar</button><button id="openPlant">Abrir planta do piso</button></div><p id="status" role="status"></p><div class="scroll"><table><thead><tr><th>Equipamento</th><th>Tipo</th><th>IP</th><th>VLAN</th><th>Gateway</th><th>Localização</th></tr></thead><tbody id="rows"></tbody></table></div><nav><button id="previous">Anterior</button><span id="page"></span><button id="next">Seguinte</button></nav><section id="plant" aria-label="Planta do piso"></section></main><script type="module" src="/inventory-page.js"></script></body></html>
