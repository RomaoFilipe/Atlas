<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório de entrega · Atlas</title><link rel="stylesheet" href="/product.css"><script src="/client-context.js"></script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#09121e"></head><body><header class="product-header"><a class="brand" href="/"><span class="brand-icon">◈</span> atlas</a><nav data-product-nav aria-label="Navegação principal"></nav></header><main><div class="hero"><div class="eyebrow">O seu espaço de trabalho</div><h1>Relatório de entrega</h1><p>Escolha a unidade, personalize a identificação e selecione o conteúdo a entregar.</p></div><p id="productStatus" role="status"></p><form id="deliveryForm" class="panel no-print"><div class="split"><div><label>Unidade<select name="unit" required></select></label><label>Título do relatório<input name="title" maxlength="160" value="Relatório de entrega"></label><label>Preparado por<input name="company" maxlength="160"></label><label>Cliente<input name="client" maxlength="160"></label><label>Contacto<input name="contact" maxlength="200"></label></div><div><label>Logótipo PNG/JPEG/WebP<input name="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Notas para o cliente<textarea name="notes" maxlength="3000"></textarea></label><label class="check"><input name="plans" type="checkbox" checked>Plantas dos pisos</label><label class="check"><input name="inventory" type="checkbox" checked>Inventário e endereçamento</label><label class="check"><input name="maintenance" type="checkbox" checked>Revisões e intervenções</label><label class="check"><input name="issues" type="checkbox" checked>Pendências e tarefas</label></div></div><button>Gerar pré-visualização</button></form><div class="actions no-print" id="reportActions" hidden><button id="printReport">Imprimir / guardar PDF</button><button id="publishReport" data-editor-only>Disp
